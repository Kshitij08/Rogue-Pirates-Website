<!doctype html>
<!--
  Rogue Pirates — browser version (placeholder)
  ------------------------------------------------------------------------
  When the Unity WebGL build is ready, replace this folder's contents with
  the build output (index.html, Build/, TemplateData/), then set
  PLAY.live = true in /assets/js/main.js.
  vercel.json already sends the right headers for Brotli/Gzip-compressed
  Unity builds (Build/*.br, Build/*.gz).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play Rogue Pirates — Coming soon</title>
  <meta name="description" content="Rogue Pirates is coming to your browser. Join the crew on Discord to hear the moment it launches.">
  <meta name="theme-color" content="#0a3d7a">
  <meta property="og:title" content="Play Rogue Pirates in your browser">
  <meta property="og:description" content="The browser version is almost ready to set sail.">
  <meta property="og:image" content="/assets/og-image.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #ffc53d; --gold-hi: #ffe07a; --brown: #5b2a07; --ink: #eef4ea; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Cinzel", "Times New Roman", serif;
      color: var(--ink);
      background: #04244f url("/assets/img/bg/full-1600.webp") center top / cover no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 55%, rgb(3 14 32 / .35), rgb(3 14 32 / .75));
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(560px, 100%);
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }
    .logo { width: min(340px, 78vw); height: auto; filter: drop-shadow(0 8px 20px rgb(0 0 0 / .35)); }
    .badge {
      padding: 7px 14px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgb(255 214 110 / .65);
      background: rgb(4 18 40 / .5);
      font: 700 11px/1 "Cinzel", serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold-hi);
    }
    h1 { margin: 0; font: 600 clamp(26px, 5vw, 38px)/1.15 "Cinzel", serif; text-wrap: balance; text-shadow: 0 2px 12px rgb(0 0 0 / .4); }
    p { margin: 0; font-size: 16px; line-height: 1.6; color: rgb(238 244 234 / .82); max-width: 460px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      padding: 0 22px;
      border-radius: 999px;
      font: 700 13px/1 "Cinzel", serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform .2s, filter .2s, background-color .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn--gold { background: linear-gradient(180deg, var(--gold-hi), #f5a623); color: var(--brown); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .15), 0 6px 18px rgb(0 0 0 / .3); }
    .btn--gold img { width: 26px; height: 26px; border-radius: 50%; margin-left: -8px; }
    .btn--ghost { color: #fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .45); background: rgb(4 18 40 / .4); }
    .btn--ghost:hover { background: rgb(4 18 40 / .65); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="Rogue Pirates home"><img class="logo" src="/assets/img/logo-800.webp" width="800" height="404" alt="Rogue Pirates"></a>
    <span class="badge">Coming soon</span>
    <h1>The browser version is almost ready to set sail</h1>
    <p>We're putting the finishing touches on Rogue Pirates for the web. Join the crew on Discord to hear the moment it launches.</p>
    <div class="actions">
      <a class="btn btn--gold" href="https://discord.gg/mU9ys5VQMY" target="_blank" rel="noopener">
        <img src="/assets/img/social-discord.webp" width="240" height="241" alt="">Join the crew
      </a>
      <a class="btn btn--ghost" href="/">Back to the website</a>
    </div>
  </main>
</body>
</html>
